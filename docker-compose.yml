services:
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4321}

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_URLS: ${PUBLIC_API_URLS:-http://localhost:3001}
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    ports:
      - "${FRONTEND_PORT:-4321}:4321"
    depends_on:
      - backend
